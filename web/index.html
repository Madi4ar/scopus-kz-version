<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Реестр журналов РК</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    color-scheme: light dark;
    --bg:#eef0ea; --surface:#ffffff; --border:#d7dbd0; --ink:#1f2b24; --ink-muted:#5c6459;
    --accent:#0f5c4a; --accent-weak:#e1ece6; --mono-bg:#e8e5d8; --mono-fg:#46493c;
    --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
    --sans:"Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg:#121715; --surface:#181f1c; --border:#2a332d; --ink:#e8ece6; --ink-muted:#8d9790;
      --accent:#52d9ac; --accent-weak:#16302a; --mono-bg:#1f2622; --mono-fg:#b9c2b8;
    }
  }
  :root[data-theme="dark"] {
    --bg:#121715; --surface:#181f1c; --border:#2a332d; --ink:#e8ece6; --ink-muted:#8d9790;
    --accent:#52d9ac; --accent-weak:#16302a; --mono-bg:#1f2622; --mono-fg:#b9c2b8;
  }
  *{box-sizing:border-box;}
  html, body{background:var(--bg);}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans); margin:0;
    padding:0 16px 64px; max-width:860px; margin-inline:auto;
  }
  img{max-width:100%;}
  header.masthead{
    padding-block:28px 18px; border-bottom:1px solid var(--border); margin-bottom:18px;
  }
  h1{
    font-family:var(--serif); font-weight:700; font-size:27px; margin:0 0 6px; letter-spacing:-0.01em;
    text-wrap:balance;
  }
  .eyebrow{
    font-family:var(--mono); font-size:12px; color:var(--ink-muted); letter-spacing:0.02em;
    font-variant-numeric:tabular-nums; display:flex; gap:6px; flex-wrap:wrap;
  }
  .eyebrow .dot{opacity:0.5;}

  .searchbar{
    display:flex; gap:8px; margin:20px 0 14px; position:sticky; top:0; background:var(--bg);
    padding-block:10px; z-index:5;
  }
  input[type="search"]{
    flex:1; min-width:0; padding:12px 14px; border-radius:8px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--ink); font-family:var(--sans); font-size:15px;
  }
  input[type="search"]:focus-visible{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  button{
    padding:12px 20px; border-radius:8px; border:1.5px solid var(--accent); background:var(--accent);
    color:var(--surface); font-family:var(--sans); font-size:14px; font-weight:600; cursor:pointer;
    white-space:nowrap;
  }
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: no-preference){
    button, .chip, .toggle-abstract{transition:opacity 0.15s ease, background-color 0.15s ease;}
  }
  button:hover{opacity:0.88;}

  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px;}
  .chip{
    padding:6px 13px; border-radius:999px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink-muted); font-family:var(--mono); font-size:12px; cursor:pointer; user-select:none;
  }
  .chip:hover{border-color:var(--accent);}
  .chip.active{background:var(--accent-weak); color:var(--accent); border-color:var(--accent);}

  .status{color:var(--ink-muted); font-size:13px; margin-bottom:12px; min-height:18px; font-family:var(--mono);}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:18px 20px; margin-bottom:12px;
  }
  .card h3{
    font-family:var(--serif); font-weight:600; font-size:16.5px; margin:0 0 8px; line-height:1.4;
    text-wrap:balance;
  }
  .card h3 a{color:var(--ink); text-decoration:none;}
  .card h3 a:hover{color:var(--accent);}

  .meta{display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-muted); margin-bottom:8px; align-items:center;}
  .meta .journal{
    color:var(--accent); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em;
  }
  .techline{
    font-family:var(--mono); font-size:11.5px; color:var(--mono-fg); background:var(--mono-bg);
    display:inline-flex; gap:10px; padding:4px 9px; border-radius:5px; margin-bottom:10px;
    font-variant-numeric:tabular-nums; flex-wrap:wrap;
  }

  .abstract{font-size:13.5px; color:var(--ink-muted); line-height:1.6; max-height:4.8em; overflow:hidden;}
  .card.expanded .abstract{max-height:none;}
  .toggle-abstract{
    background:none; border:none; padding:0; margin-top:6px; color:var(--accent); font-family:var(--sans);
    font-size:12.5px; font-weight:600; cursor:pointer; text-decoration:underline; text-decoration-style:dotted;
  }

  .links{margin-top:12px; display:flex; gap:16px; font-size:12.5px; flex-wrap:wrap;}
  .links a{color:var(--accent); text-decoration:none; font-weight:500;}
  .links a:hover{text-decoration:underline;}
  .links a:focus-visible, .toggle-abstract:focus-visible, .cite-toggle:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .cite-toggle{
    background:none; border:none; padding:0; color:var(--accent); font-family:var(--sans); font-size:12.5px;
    font-weight:500; cursor:pointer;
  }
  .cite-toggle:hover{text-decoration:underline;}
  .cite-panel{
    margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);
    display:flex; flex-direction:column; gap:10px;
  }
  .cite-format-label{
    font-family:var(--mono); font-size:10px; text-transform:uppercase; color:var(--ink-muted);
    letter-spacing:0.04em; display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;
  }
  .cite-text{
    font-size:13px; line-height:1.55; background:var(--mono-bg); color:var(--ink); padding:9px 11px;
    border-radius:6px; white-space:pre-wrap; word-break:break-word; margin:0;
  }
  .cite-text.bibtex{font-family:var(--mono); font-size:11.5px;}
  .copy-btn{
    background:none; border:1px solid var(--border); border-radius:5px; padding:2px 9px; font-size:10.5px;
    font-family:var(--sans); color:var(--accent); cursor:pointer;
  }
  .copy-btn:hover{border-color:var(--accent);}
  .copy-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .quality{
    display:inline-block; padding:2px 8px; border-radius:5px; font-size:10.5px; font-family:var(--mono);
    background:var(--mono-bg); color:var(--mono-fg); text-transform:uppercase; letter-spacing:0.03em;
  }
  .empty, .loading{color:var(--ink-muted); font-size:14px; text-align:center; padding:48px 0; font-family:var(--mono);}

  .navtabs{display:flex; gap:6px; margin-top:16px;}
  .navtab{
    padding:8px 16px; border-radius:7px 7px 0 0; border:1px solid transparent; background:none;
    color:var(--ink-muted); font-family:var(--sans); font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .navtab.active{
    background:var(--surface); border-color:var(--border); border-bottom-color:var(--surface);
    color:var(--accent); position:relative; top:1px;
  }
  [hidden]{display:none!important;}

  .profile-card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:20px 22px; margin-bottom:14px;
  }
  .profile-card h3{
    font-family:var(--serif); font-weight:600; font-size:18px; margin:0 0 4px; text-wrap:balance;
  }
  .profile-card h3 a{color:var(--ink); text-decoration:none;}
  .profile-card h3 a:hover{color:var(--accent);}
  .profile-publisher{font-size:13px; color:var(--ink-muted); margin-bottom:12px;}
  .profile-discipline{
    font-size:11.5px; color:var(--accent); text-transform:uppercase; letter-spacing:0.04em;
    font-weight:600; margin-bottom:10px;
  }
  .stat-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px 18px;
    margin-bottom:14px;
  }
  .stat{display:flex; flex-direction:column; gap:2px;}
  .stat-label{
    font-family:var(--mono); font-size:10px; color:var(--ink-muted); text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .stat-value{
    font-family:var(--mono); font-size:13px; color:var(--ink); font-variant-numeric:tabular-nums;
  }
  .profile-card .links{margin-top:4px;}
</style>
</head>
<body>

<header class="masthead">
  <h1>Реестр журналов РК</h1>
  <div class="eyebrow" id="eyebrow">Загрузка каталога…</div>
  <nav class="navtabs">
    <button class="navtab active" id="tabSearch" type="button">Поиск статей</button>
    <button class="navtab" id="tabJournals" type="button">Журналы</button>
  </nav>
</header>

<section id="searchView">
  <div class="searchbar">
    <input type="search" id="q" placeholder="Поиск по названию, авторам, аннотации, ключевым словам…" autocomplete="off" />
    <button id="searchBtn" type="button">Искать</button>
  </div>
  <div class="filters" id="journalFilters"></div>
  <div class="status" id="status"></div>
  <div id="results"></div>
</section>

<section id="journalsView" hidden>
  <p class="status" style="margin-top:20px;">Карточка реестра: издатель, ISSN, отрасль, тип источника, платформа и статус харвестинга по каждому журналу.</p>
  <div id="journalProfiles"></div>
</section>

<script>
  const SUPABASE_URL = "https://bsnhhwpogtbwahyeapop.supabase.co";
  const SUPABASE_KEY = "sb_publishable_S16Al-SNpX0gz91AdaacNQ_8ujVpmk_";

  const qInput = document.getElementById('q');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');
  const filtersEl = document.getElementById('journalFilters');
  const eyebrowEl = document.getElementById('eyebrow');
  const tabSearch = document.getElementById('tabSearch');
  const tabJournals = document.getElementById('tabJournals');
  const searchView = document.getElementById('searchView');
  const journalsView = document.getElementById('journalsView');
  const journalProfilesEl = document.getElementById('journalProfiles');

  let journals = [];
  let activeJournalId = null;
  let profilesLoaded = false;

  async function sb(path, opts = {}) {
    const res = await fetch(SUPABASE_URL + path, {
      ...opts,
      headers: {
        apikey: SUPABASE_KEY,
        'Content-Type': 'application/json',
        ...(opts.headers || {}),
      },
    });
    if (!res.ok) throw new Error('Supabase request failed: ' + res.status);
    return res.json();
  }

  async function sbCount(path) {
    const res = await fetch(SUPABASE_URL + path, {
      headers: { apikey: SUPABASE_KEY, Prefer: 'count=exact', Range: '0-0' },
    });
    const range = res.headers.get('content-range') || '';
    const total = range.split('/')[1];
    return total ? parseInt(total, 10) : null;
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function parseAuthors(str) {
    if (!str) return [];
    return str.split(';').map(s => s.trim()).filter(Boolean).map(name => {
      const parts = name.split(',');
      if (parts.length >= 2) return { last: parts[0].trim(), first: parts.slice(1).join(',').trim() };
      return { last: name.trim(), first: '' };
    });
  }

  function citeYear(dateStr) { return dateStr ? dateStr.slice(0, 4) : 'б.г.'; }

  function citeAPA(r) {
    const authors = parseAuthors(r.authors);
    const formatted = authors.map(a => a.first ? `${a.last}, ${a.first}` : a.last);
    let authorStr = '';
    if (formatted.length === 1) authorStr = formatted[0];
    else if (formatted.length > 1) authorStr = formatted.slice(0, -1).join(', ') + ', & ' + formatted[formatted.length - 1];
    const y = citeYear(r.publication_date);
    const vol = r.volume ? `, ${r.volume}` : '';
    const issue = r.issue ? `(${r.issue})` : '';
    const pages = r.pages ? `, ${r.pages}` : '';
    const doi = r.doi ? ` https://doi.org/${r.doi}` : '';
    return `${authorStr}${authorStr ? ' ' : ''}(${y}). ${r.title}. ${r.journal_name || ''}${vol}${issue}${pages}.${doi}`.replace(/\s+/g, ' ').trim();
  }

  function citeGOST(r) {
    const authors = parseAuthors(r.authors);
    const authorStr = authors.map(a => a.first ? `${a.last} ${a.first}` : a.last).join(', ');
    const y = citeYear(r.publication_date);
    let tail = ` – ${y}.`;
    if (r.volume) tail += ` – Т. ${r.volume}`;
    if (r.issue) tail += `${r.volume ? ',' : ' –'} № ${r.issue}`;
    if (r.volume || r.issue) tail += '.';
    if (r.pages) tail += ` – С. ${r.pages}.`;
    return `${authorStr ? authorStr + ' ' : ''}${r.title} // ${r.journal_name || ''}.${tail}`.replace(/\s+/g, ' ').trim();
  }

  function citeBibTeX(r) {
    const authors = parseAuthors(r.authors);
    const bibAuthors = authors.map(a => a.first ? `${a.last}, ${a.first}` : a.last).join(' and ');
    const y = citeYear(r.publication_date);
    const slug = (authors[0] ? authors[0].last : 'Unknown').replace(/[^a-zA-Zа-яА-Я]/g, '');
    const lines = [
      `@article{${slug}${y},`,
      `  author  = {${bibAuthors}},`,
      `  title   = {${r.title}},`,
      `  journal = {${r.journal_name || ''}},`,
      `  year    = {${y}},`,
    ];
    if (r.volume) lines.push(`  volume  = {${r.volume}},`);
    if (r.issue) lines.push(`  number  = {${r.issue}},`);
    if (r.pages) lines.push(`  pages   = {${r.pages}},`);
    if (r.doi) lines.push(`  doi     = {${r.doi}},`);
    if (r.article_url) lines.push(`  url     = {${r.article_url}},`);
    lines.push('}');
    return lines.join('\n');
  }

  function shortName(name) {
    if (!name) return '';
    if (name.includes('Gumilyov')) return 'ENU Philology';
    if (name.includes('Karaganda')) return 'Buketov Philology';
    if (name.includes('Journalism')) return 'KazNU Journalism';
    return name;
  }

  async function loadJournals() {
    journals = await sb('/rest/v1/journals?select=id,name&order=name');
    filtersEl.innerHTML = '<span class="chip active" data-id="" role="button" tabindex="0">Все журналы</span>' +
      journals.map(j => `<span class="chip" data-id="${j.id}" role="button" tabindex="0">${escapeHtml(shortName(j.name))}</span>`).join('');
    filtersEl.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => selectJournalFilter(chip.dataset.id || null));
    });

    const total = await sbCount('/rest/v1/articles?select=id');
    eyebrowEl.innerHTML = `<span>${total != null ? total.toLocaleString('ru-RU') : '—'} статей</span><span class="dot">·</span><span>${journals.length} журнала</span><span class="dot">·</span><span>обновление через OAI-PMH</span>`;
  }

  function renderResults(rows) {
    if (!rows.length) {
      resultsEl.innerHTML = '<div class="empty">Ничего не найдено. Попробуйте другой запрос.</div>';
      return;
    }
    resultsEl.innerHTML = rows.map(r => {
      const tech = [];
      if (r.volume) tech.push(`Vol. ${escapeHtml(r.volume)}${r.issue ? ', No. ' + escapeHtml(r.issue) : ''}`);
      if (r.pages) tech.push(`pp. ${escapeHtml(r.pages)}`);
      if (r.publication_date) tech.push(escapeHtml(r.publication_date));
      if (r.doi) tech.push(`doi:${escapeHtml(r.doi)}`);
      return `
      <div class="card">
        <div class="meta">
          <span class="journal">${escapeHtml(shortName(r.journal_name || ''))}</span>
          <span class="quality">${escapeHtml(r.metadata_quality || '')}</span>
        </div>
        <h3><a href="${escapeHtml(r.article_url || '#')}" target="_blank" rel="noopener">${escapeHtml(r.title)}</a></h3>
        ${r.authors ? `<div class="meta">${escapeHtml(r.authors)}</div>` : ''}
        ${tech.length ? `<div class="techline">${tech.map(t => `<span>${t}</span>`).join('')}</div>` : ''}
        ${r.abstract ? `
          <div class="abstract">${escapeHtml(r.abstract)}</div>
          <button class="toggle-abstract" type="button">Показать аннотацию целиком ▾</button>
        ` : ''}
        <div class="links">
          ${r.article_url ? `<a href="${escapeHtml(r.article_url)}" target="_blank" rel="noopener">Страница статьи →</a>` : ''}
          ${r.doi ? `<a href="https://doi.org/${escapeHtml(r.doi)}" target="_blank" rel="noopener">Открыть по DOI →</a>` : ''}
          <button class="cite-toggle" type="button">Цитировать ▾</button>
        </div>
        <div class="cite-panel" hidden>
          <div>
            <div class="cite-format-label"><span>APA</span><button class="copy-btn" type="button" data-fmt="apa">Копировать</button></div>
            <p class="cite-text" data-fmt="apa">${escapeHtml(citeAPA(r))}</p>
          </div>
          <div>
            <div class="cite-format-label"><span>ГОСТ Р 7.0.5</span><button class="copy-btn" type="button" data-fmt="gost">Копировать</button></div>
            <p class="cite-text" data-fmt="gost">${escapeHtml(citeGOST(r))}</p>
          </div>
          <div>
            <div class="cite-format-label"><span>BibTeX</span><button class="copy-btn" type="button" data-fmt="bibtex">Копировать</button></div>
            <pre class="cite-text bibtex" data-fmt="bibtex">${escapeHtml(citeBibTeX(r))}</pre>
          </div>
        </div>
      </div>
    `;
    }).join('');
    resultsEl.querySelectorAll('.card').forEach(card => {
      const abstractBtn = card.querySelector('.toggle-abstract');
      if (abstractBtn) {
        abstractBtn.addEventListener('click', () => {
          card.classList.toggle('expanded');
          abstractBtn.textContent = card.classList.contains('expanded')
            ? 'Свернуть аннотацию ▴'
            : 'Показать аннотацию целиком ▾';
        });
      }
      const citeBtn = card.querySelector('.cite-toggle');
      const citePanel = card.querySelector('.cite-panel');
      if (citeBtn && citePanel) {
        citeBtn.addEventListener('click', () => {
          citePanel.hidden = !citePanel.hidden;
          citeBtn.textContent = citePanel.hidden ? 'Цитировать ▾' : 'Скрыть цитирование ▴';
        });
      }
      card.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const text = card.querySelector(`.cite-text[data-fmt="${btn.dataset.fmt}"]`).textContent;
          try {
            await navigator.clipboard.writeText(text);
            const original = btn.textContent;
            btn.textContent = 'Скопировано';
            setTimeout(() => { btn.textContent = original; }, 1500);
          } catch (e) {
            btn.textContent = 'Не удалось';
          }
        });
      });
    });
  }

  async function runSearch() {
    const query = qInput.value.trim();
    statusEl.textContent = 'Загрузка…';
    resultsEl.innerHTML = '';
    try {
      let rows;
      if (query) {
        rows = await sb('/rest/v1/rpc/search_articles', {
          method: 'POST',
          body: JSON.stringify({ query, limit_count: 40 }),
        });
        if (activeJournalId) rows = rows.filter(r => r.journal_id === activeJournalId);
      } else {
        const filter = activeJournalId ? `&journal_id=eq.${activeJournalId}` : '';
        rows = await sb(`/rest/v1/articles?select=*,journals(name)${filter}&order=publication_date.desc.nullslast&limit=40`);
        rows = rows.map(r => ({ ...r, journal_name: r.journals?.name }));
      }
      statusEl.textContent = query
        ? `Найдено ${rows.length} по запросу «${query}»`
        : `Последние ${rows.length} статей`;
      renderResults(rows);
    } catch (e) {
      statusEl.textContent = 'Ошибка запроса к базе.';
      resultsEl.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
    }
  }

  function showView(view) {
    const isSearch = view === 'search';
    searchView.hidden = !isSearch;
    journalsView.hidden = isSearch;
    tabSearch.classList.toggle('active', isSearch);
    tabJournals.classList.toggle('active', !isSearch);
    if (!isSearch && !profilesLoaded) loadJournalProfiles();
  }

  function selectJournalFilter(id) {
    activeJournalId = id || null;
    filtersEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', (c.dataset.id || null) === activeJournalId));
    showView('search');
    runSearch();
  }

  function formatDate(iso) {
    if (!iso) return 'ещё не запускался';
    return new Date(iso).toLocaleString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  async function loadJournalProfiles() {
    journalProfilesEl.innerHTML = '<div class="loading">Загрузка профилей…</div>';
    try {
      const profiles = await sb('/rest/v1/rpc/journal_profiles', { method: 'POST', body: JSON.stringify({}) });
      journalProfilesEl.innerHTML = profiles.map(p => `
        <div class="profile-card">
          <div class="profile-discipline">${escapeHtml(p.discipline || 'Отрасль не указана')}</div>
          <h3><a href="${escapeHtml(p.base_url)}" target="_blank" rel="noopener">${escapeHtml(p.name)}</a></h3>
          <div class="profile-publisher">${escapeHtml(p.publisher || 'Издатель не указан')}</div>
          <div class="stat-grid">
            <div class="stat"><span class="stat-label">ISSN печ.</span><span class="stat-value">${escapeHtml(p.issn_print || '—')}</span></div>
            <div class="stat"><span class="stat-label">ISSN онлайн</span><span class="stat-value">${escapeHtml(p.issn_online || '—')}</span></div>
            <div class="stat"><span class="stat-label">Тип источника</span><span class="stat-value">${escapeHtml(p.source_type || '—')}</span></div>
            <div class="stat"><span class="stat-label">Платформа</span><span class="stat-value">${escapeHtml(p.platform || '—')}</span></div>
            <div class="stat"><span class="stat-label">Язык</span><span class="stat-value">${escapeHtml(p.language || '—')}</span></div>
            <div class="stat"><span class="stat-label">Открытый доступ</span><span class="stat-value">${p.open_access ? 'Да' : 'Нет'}</span></div>
            <div class="stat"><span class="stat-label">Статей собрано</span><span class="stat-value">${p.article_count}</span></div>
            <div class="stat"><span class="stat-label">Обновлено</span><span class="stat-value">${formatDate(p.last_crawled_at)}</span></div>
          </div>
          <div class="links">
            <a href="${escapeHtml(p.oai_endpoint || '#')}" target="_blank" rel="noopener">OAI-PMH endpoint →</a>
            <a href="#" class="show-articles" data-id="${p.id}">Показать статьи этого журнала →</a>
          </div>
        </div>
      `).join('');
      profilesLoaded = true;
      journalProfilesEl.querySelectorAll('.show-articles').forEach(a => {
        a.addEventListener('click', (e) => { e.preventDefault(); selectJournalFilter(a.dataset.id); });
      });
    } catch (e) {
      journalProfilesEl.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
    }
  }

  tabSearch.addEventListener('click', () => showView('search'));
  tabJournals.addEventListener('click', () => showView('journals'));

  document.getElementById('searchBtn').addEventListener('click', runSearch);
  qInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });

  loadJournals().then(runSearch);
</script>
</body>
</html>
